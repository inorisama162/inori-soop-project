      '<section class="slide">'+title("POINT SETTLEMENT · SEPTEMBER","9월 포인트 정산 안내")+'<div class="exchange"><div class="settlement"><article class="status"><small>09.01—09.30</small><strong>9월 활동분</strong><span>참여시간 · 채팅 · 클립 기록 기준</span></article><article class="status pending"><small>임시 안내</small><strong>방송 후 순차 정산</strong><span>팬영상·팬아트는 카페 댓글 확인 후 반영합니다.</span></article></div><div class="schedule"><article class="date-card"><small>방송 활동</small><strong>참여시간 · 채팅 · 클립</strong></article><article class="date-card"><small>카페 활동</small><strong>팬영상 · 팬아트</strong></article><div class="form-btn disabled"><span>정산 확인 페이지 준비 중</span><b>···</b></div></div></div><div class="exchange-note">집계표와 포인트 확인 방식은 새 사이트 적용 시 최종 안내드리겠습니다.</div></section>'
    ];
    let index=0,touchX=null;
    const slide=document.getElementById("slide"),label=document.getElementById("label"),current=document.getElementById("current"),bar=document.getElementById("bar");
    document.getElementById("total").textContent=String(slides.length).padStart(2,"0");
    const render=()=>{slide.style.animation="none";void slide.offsetWidth;slide.style.animation="";slide.innerHTML=slides[index];label.textContent=labels[index];current.textContent=String(index+1).padStart(2,"0");bar.style.width=((index+1)/slides.length*100)+"%";document.getElementById("prev").disabled=index===0;document.getElementById("next").disabled=index===slides.length-1};
    const go=n=>{index=Math.max(0,Math.min(n,slides.length-1));render()},next=()=>go(index+1),prev=()=>go(index-1);
    document.getElementById("next").onclick=next;document.getElementById("prev").onclick=prev;
    document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();
    slide.addEventListener("click",e=>{const mask=e.target.closest(".nickname-mask");if(!mask)return;e.preventDefault();e.stopPropagation();if(mask.classList.contains("revealed"))return;const name=mask.dataset.name;mask.classList.add("revealed");mask.textContent=name;mask.setAttribute("aria-label",name)});
    document.getElementById("app").addEventListener("click",e=>{if(e.target.closest("a,button"))return;e.clientX/window.innerWidth<.24?prev():next()});
    addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("button,a"))return;if(["ArrowRight"," ","Enter","PageDown"].includes(e.key)){e.preventDefault();next()}if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="f")document.documentElement.requestFullscreen?.()});
    addEventListener("touchstart",e=>touchX=e.touches[0]?.clientX,{passive:true});addEventListener("touchend",e=>{if(touchX===null)return;const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>50)d<0?next():prev();touchX=null},{passive:true});
    const sparkleCanvas=document.getElementById("sparkles"),sparkleCtx=sparkleCanvas.getContext("2d"),sparkleColors=["#ffffff","#ddd9ff","#b9c8ff","#fff2b8"];
    let sparkleRatio=1,sparkleFrame=0,lastSparkle=0,sparkleParticles=[];
    const resizeSparkles=()=>{sparkleRatio=Math.min(devicePixelRatio||1,1.5);sparkleCanvas.width=Math.round(innerWidth*sparkleRatio);sparkleCanvas.height=Math.round(innerHeight*sparkleRatio);sparkleCtx.setTransform(sparkleRatio,0,0,sparkleRatio,0,0)};
    const drawSparkles=()=>{
      sparkleCtx.clearRect(0,0,innerWidth,innerHeight);
      sparkleParticles=sparkleParticles.filter(p=>{
        p.x+=p.vx;p.y+=p.vy;p.vy+=p.gravity;p.rotation+=p.spin;p.life-=p.decay;
        if(p.life<=0)return false;
        sparkleCtx.save();sparkleCtx.translate(p.x,p.y);sparkleCtx.rotate(p.rotation);sparkleCtx.globalAlpha=Math.min(1,p.life*1.9);sparkleCtx.globalCompositeOperation="lighter";sparkleCtx.fillStyle=p.color;sparkleCtx.shadowColor=p.color;sparkleCtx.shadowBlur=14;sparkleCtx.beginPath();
        for(let point=0;point<8;point++){const radius=point%2?p.size*.22:p.size,angle=-Math.PI/2+point*Math.PI/4,x=Math.cos(angle)*radius,y=Math.sin(angle)*radius;point?sparkleCtx.lineTo(x,y):sparkleCtx.moveTo(x,y)}
        sparkleCtx.closePath();sparkleCtx.fill();sparkleCtx.restore();
        return true;
      });
      sparkleFrame=sparkleParticles.length?requestAnimationFrame(drawSparkles):0;
    };
    const sparkleAt=(x,y,count=1)=>{
      for(let i=0;i<count;i++){
        sparkleParticles.push({x:x+(Math.random()-.5)*13,y:y+(Math.random()-.5)*9,vx:(Math.random()-.5)*1.6,vy:.75+Math.random()*1.25,gravity:.035+Math.random()*.025,life:1,decay:.013+Math.random()*.007,size:5+Math.random()*6,rotation:Math.random()*Math.PI,spin:(Math.random()-.5)*.1,color:sparkleColors[Math.floor(Math.random()*sparkleColors.length)]});
      }
      if(sparkleParticles.length>100)sparkleParticles.splice(0,sparkleParticles.length-100);
      if(!sparkleFrame)sparkleFrame=requestAnimationFrame(drawSparkles);
    };
    resizeSparkles();addEventListener("resize",resizeSparkles,{passive:true});
    addEventListener("mousemove",e=>{const now=performance.now();if(now-lastSparkle<22)return;lastSparkle=now;sparkleAt(e.clientX,e.clientY,Math.random()>.55?3:2)},{passive:true});
    addEventListener("pointerdown",e=>sparkleAt(e.clientX,e.clientY,12),{passive:true});
    render();
  </script>
