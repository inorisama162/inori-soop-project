<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>이노리 8월 시청자 어워드</title>
  <meta name="description" content="방송에서 클릭하며 진행하는 이노리 8월 시청자 어워드">
  <style>
    :root{
      --night:#060a25;--night2:#0a1238;--ink:#f8f9ff;--muted:#aeb7d8;
      --lav:#c9c7ff;--blue:#718ad7;--gold:#fff6c8;--line:rgba(228,231,255,.22)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink)}
    body{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    .app{
      position:relative;min-height:100svh;overflow:hidden;isolation:isolate;
      display:grid;grid-template-rows:44px minmax(0,1fr) 56px;gap:10px;padding:10px 18px;
      background:
        radial-gradient(circle at 18% 24%,rgba(99,125,202,.36),transparent 30rem),
        radial-gradient(circle at 82% 72%,rgba(139,131,215,.22),transparent 34rem),
        linear-gradient(135deg,var(--night2),#080d2a 48%,#05081d)
    }
    .app:before{
      content:"";position:absolute;inset:0;z-index:-2;opacity:.26;
      background-image:radial-gradient(circle,rgba(255,255,255,.72) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(197,196,255,.68) 0 1px,transparent 1.5px);
      background-position:0 0,25px 31px;background-size:83px 83px,127px 127px;
      mask-image:linear-gradient(to bottom,#000,transparent 84%);animation:starDrift 24s linear infinite
    }
    .app:after{content:"";position:absolute;z-index:-1;inset:-25%;pointer-events:none;background:radial-gradient(circle at 32% 30%,rgba(144,154,242,.18),transparent 25%),radial-gradient(circle at 70% 68%,rgba(111,132,219,.16),transparent 28%);filter:blur(28px);animation:auroraFloat 11s ease-in-out infinite alternate}
    @keyframes starDrift{to{background-position:83px 83px,152px 158px}}
    @keyframes auroraFloat{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(3%,2%,0) scale(1.08)}}
    .rail{position:relative;z-index:5;width:min(100%,1600px);margin:auto;display:flex;align-items:center}
    .top{justify-content:space-between;color:rgba(241,243,255,.72)}
    .brand{display:flex;gap:11px;align-items:center;font:12px Georgia,serif;letter-spacing:.18em}
    .brand i{width:1px;height:15px;background:rgba(255,255,255,.3)}
    .hint{margin-left:auto;margin-right:8px;font-size:10px;letter-spacing:.18em;opacity:.52}
    .icon-btn{
      width:36px;height:36px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.14);
      border-radius:7px;color:#fff;background:rgba(255,255,255,.04);cursor:pointer
    }
    .icon-btn:hover{background:rgba(255,255,255,.12)}
    .stage{
      position:relative;width:min(100%,calc((100svh - 140px)*16/9),1600px);aspect-ratio:16/9;overflow:hidden;
      min-height:0;margin:auto;border:1px solid rgba(225,228,255,.18);
      background:linear-gradient(130deg,rgba(71,92,162,.19),transparent 34%),linear-gradient(315deg,rgba(129,116,200,.12),transparent 38%),rgba(6,10,34,.74);
      box-shadow:0 2rem 5rem rgba(0,0,0,.33),inset 0 0 4rem rgba(126,145,222,.05)
    }
    .stage:before{content:"";position:absolute;z-index:3;top:-40%;bottom:-40%;left:-38%;width:24%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(224,228,255,.1),rgba(255,255,255,.18),rgba(199,204,255,.08),transparent);filter:blur(7px);transform:skewX(-14deg);animation:lightSweep 6.8s ease-in-out infinite}
    @keyframes lightSweep{0%,20%{left:-38%;opacity:0}32%{opacity:1}56%{left:118%;opacity:.9}62%,100%{left:118%;opacity:0}}
    .corner{position:absolute;z-index:4;width:22px;height:22px;pointer-events:none}
    .corner:before,.corner:after{content:"";position:absolute;background:rgba(237,239,255,.78)}
    .corner:before{width:100%;height:1px}.corner:after{width:1px;height:100%}
    .tl{top:-1px;left:-1px}.tr{top:-1px;right:-1px;transform:rotate(90deg)}
    .bl{bottom:-1px;left:-1px;transform:rotate(-90deg)}.br{bottom:-1px;right:-1px;transform:rotate(180deg)}
    #slide{height:100%;overflow:hidden;animation:enter .58s cubic-bezier(.16,.82,.25,1) both}
    @keyframes enter{from{opacity:0;transform:translate3d(34px,0,0) scale(.985);filter:blur(7px)}60%{filter:blur(0)}to{opacity:1;transform:none;filter:none}}
    .slide{position:relative;isolation:isolate;height:100%;padding:clamp(22px,3.2vw,58px) clamp(26px,4.3vw,82px)}
    .slide:before{content:"";position:absolute;z-index:-1;width:42%;aspect-ratio:1;right:-13%;top:-28%;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(188,190,255,.13),rgba(99,119,200,.04) 40%,transparent 70%);animation:orbPulse 5.4s ease-in-out infinite alternate}
    @keyframes orbPulse{from{transform:scale(.86);opacity:.48}to{transform:scale(1.16);opacity:1}}
    .slide:after{
      content:"2026.08 · INORI MONTHLY AWARDS";position:absolute;right:clamp(26px,4.3vw,82px);bottom:20px;
      color:rgba(231,233,255,.34);font:clamp(8px,.7vw,12px) Georgia,serif;letter-spacing:.17em
    }
    .title{display:flex;justify-content:space-between;align-items:flex-start;min-height:94px;padding-bottom:clamp(12px,1.5vw,22px);border-bottom:1px solid var(--line);animation:headingIn .62s .08s cubic-bezier(.16,.82,.25,1) backwards}
    @keyframes headingIn{from{opacity:0;transform:translateY(-20px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0)}}
    .eyebrow,.label{margin:0 0 6px;color:#abb8e8;font:clamp(9px,.75vw,13px) Georgia,serif;letter-spacing:.2em}
    .title h2{margin:0;font-size:clamp(26px,3.3vw,54px);letter-spacing:-.04em}
    .reward{min-width:clamp(128px,13vw,215px);padding:11px 14px;border-left:3px solid var(--lav);background:linear-gradient(90deg,rgba(126,139,205,.22),transparent);animation:rewardGlow 2.8s 1s ease-in-out infinite alternate}
    @keyframes rewardGlow{from{box-shadow:0 0 0 rgba(183,187,255,0);border-left-color:#aeb6ed}to{box-shadow:-10px 0 28px rgba(169,173,246,.18);border-left-color:#f0efff}}
    .reward small{display:block;color:#aab6e5;font:clamp(8px,.62vw,11px) Georgia,serif;letter-spacing:.18em}
    .reward strong{display:block;margin-top:4px;font-size:clamp(13px,1.18vw,21px)}
    .cover{display:grid;place-items:center;text-align:center;overflow:hidden}.cover:after,.closing:after{content:none}
    .cover-no{position:absolute;left:-2%;bottom:-22%;color:transparent;font:clamp(320px,43vw,690px)/.74 Georgia,serif;-webkit-text-stroke:1px rgba(208,214,255,.1)}
    .cover-copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
    .serif{margin:0;color:#c0c9ee;font:clamp(10px,1vw,16px) Georgia,serif;letter-spacing:.27em}
    .cover h1{margin:clamp(13px,1.9vw,29px) 0 10px;font-size:clamp(38px,6.3vw,104px);line-height:1;letter-spacing:-.065em;color:transparent;background:linear-gradient(105deg,#fff 10%,#cdd2ff 34%,#fff 52%,#aebbe9 74%,#fff 92%);background-size:230% auto;-webkit-background-clip:text;background-clip:text;text-shadow:0 0 2.3rem rgba(167,176,239,.25);animation:titleShimmer 4s ease-in-out infinite}
    @keyframes titleShimmer{0%,18%{background-position:120% center}65%,100%{background-position:-110% center}}
    .cover-copy>p:not(.serif){margin:0;color:#c8cee9;font-size:clamp(13px,1.25vw,22px)}
    .rule{width:min(384px,50vw);display:flex;align-items:center;margin:22px 0 0}.rule span{flex:1;height:1px;background:rgba(242,244,255,.65)}
    .rule i{width:7px;height:7px;transform:rotate(45deg);background:#eef0ff}
    .start{margin-top:clamp(20px,2.7vw,43px);color:rgba(231,233,255,.65);font-size:clamp(10px,.85vw,14px)}
    .ticket{
      position:absolute;right:32px;top:32px;width:clamp(70px,7vw,112px);aspect-ratio:.72;display:flex;flex-direction:column;align-items:center;justify-content:center;
      border:1px solid rgba(228,231,255,.36);background:rgba(164,169,232,.15);clip-path:polygon(8% 0,92% 0,100% 7%,100% 93%,92% 100%,8% 100%,0 93%,0 7%);transform:rotate(4deg);animation:ticketFloat 3.6s ease-in-out infinite alternate
    }
    @keyframes ticketFloat{from{transform:translateY(-4px) rotate(3deg)}to{transform:translateY(8px) rotate(6deg)}}
    .ticket span,.ticket small{font:clamp(7px,.55vw,10px) Georgia,serif;letter-spacing:.16em}.ticket b{font:clamp(26px,3vw,50px) Georgia,serif}
    .agenda{display:grid;gap:clamp(5px,.7vw,12px);margin-top:clamp(13px,2vw,32px)}
    .agenda-row{display:grid;grid-template-columns:58px 1.05fr 1fr;align-items:baseline;gap:16px;padding:clamp(7px,.95vw,14px) 11px;border-bottom:1px solid rgba(225,228,255,.14)}
    .agenda-row span{color:#9dacdf;font:clamp(12px,1vw,16px) Georgia,serif}.agenda-row strong{font-size:clamp(15px,1.65vw,28px)}
    .agenda-row p{margin:0;color:var(--muted);font-size:clamp(11px,1vw,17px)}
    .bottom-note{position:absolute;left:clamp(26px,4.3vw,82px);bottom:42px;margin:0;color:#c5cbea;font-size:clamp(10px,.9vw,15px)}
    .split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,.9fr);gap:clamp(19px,3vw,56px);margin-top:clamp(14px,2vw,34px)}
    .rank-list{display:grid;gap:clamp(5px,.7vw,11px);margin:0;padding:0;list-style:none}
    .rank-list li{display:grid;grid-template-columns:37px minmax(128px,.9fr) minmax(64px,1.3fr) minmax(83px,auto);align-items:center;gap:13px;min-height:clamp(37px,4vw,67px);padding:0 9px;border-bottom:1px solid rgba(226,230,255,.13)}
    .rank{color:#8595cf;font:clamp(12px,1vw,17px) Georgia,serif}
    .person{display:flex;flex-direction:column;min-width:0}.person b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(13px,1.25vw,21px)}.person small{color:#7e8aad;font-size:clamp(8px,.66vw,11px)}
    .bar{height:4px;overflow:hidden;background:rgba(205,211,243,.09)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--lav));animation:grow .7s .15s ease both;transform-origin:left}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .value{font:clamp(12px,1vw,17px) Georgia,serif;text-align:right}.first .rank,.first .value,.first .person b{color:var(--gold)}
    .comment,.cutoff{position:relative;padding:clamp(16px,2vw,32px);background:linear-gradient(145deg,rgba(139,151,213,.16),transparent 68%),rgba(12,20,55,.56);border-left:1px solid rgba(221,225,255,.28)}
    .comment:before,.cutoff:before{content:"“";position:absolute;right:16px;top:-12px;color:rgba(204,207,255,.09);font:clamp(96px,10vw,176px)/1 Georgia,serif}
    .lead{position:relative;margin:13px 0 18px;font-size:clamp(15px,1.55vw,27px);font-weight:700;line-height:1.35}
    .stat{display:flex;align-items:baseline;gap:12px;margin:clamp(13px,2vw,32px) 0}.stat b{color:var(--lav);font:clamp(32px,4.8vw,80px)/.9 Georgia,serif}.stat span{color:var(--muted);font-size:clamp(10px,.85vw,14px)}
    .comment ul{display:grid;gap:9px;margin:0;padding:0;color:var(--muted);font-size:clamp(10px,.88vw,15px);list-style:none}.comment li:before{content:"—";margin-right:7px;color:#929fe0}
    .chat-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(224px,.72fr);gap:clamp(16px,2.3vw,40px);margin-top:clamp(10px,1.4vw,21px)}
    .rank-list.compact{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}.rank-list.compact li{grid-template-columns:27px minmax(84px,1fr) minmax(32px,.6fr) auto;min-height:clamp(30px,2.9vw,48px);gap:8px;padding:0 5px}
    .rank-list.compact .person b{white-space:normal;line-height:1.12;font-size:clamp(10px,.95vw,15px)}
    .cutoff{display:flex;flex-direction:column}.chart{position:relative;z-index:1;flex:1;min-height:112px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(18px,2.2vw,38px);margin:6px 0 8px;border-bottom:1px solid rgba(225,228,255,.25)}
    .chart div{height:100%;display:grid;grid-template-rows:18px minmax(0,1fr) 24px;justify-items:center;gap:4px}.chart b{font:clamp(12px,1.05vw,18px) Georgia,serif}.chart i{align-self:end;width:clamp(26px,2.7vw,45px);min-height:7px;background:linear-gradient(to top,#5873c2,var(--lav));animation:rise .65s ease both;transform-origin:bottom}
    @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}.chart span{color:#9da8cc;font-size:clamp(9px,.72vw,12px)}.cutoff .lead{margin:8px 0 3px}.mini{margin:0;color:#99a5cb;font-size:clamp(9px,.77vw,13px)}
    .winner{height:calc(100% - 112px);display:grid;grid-template-columns:clamp(80px,10vw,160px) 1fr minmax(208px,.55fr);align-items:center;gap:clamp(19px,3vw,56px)}
    .winner-no{align-self:stretch;display:grid;place-items:center;color:transparent;font:clamp(80px,11vw,176px) Georgia,serif;-webkit-text-stroke:1px rgba(210,215,255,.24);writing-mode:vertical-rl}
    .winner-copy>p{margin:0 0 6px;color:#9dacdf;font:clamp(10px,.9vw,15px) Georgia,serif;letter-spacing:.22em}.winner-copy h3{margin:0 0 clamp(13px,1.8vw,29px);font-size:clamp(36px,5.8vw,96px);line-height:1;letter-spacing:-.055em}
    .link{display:inline-flex;align-items:center;gap:8px;color:#dfe2ff;text-decoration:none;border-bottom:1px solid rgba(223,226,255,.38)}.link:hover{color:#fff;border-color:#fff}.feature{font-size:clamp(14px,1.4vw,23px);font-weight:700}
    .quotes{display:grid;gap:5px;margin-top:clamp(18px,2.4vw,40px);padding-left:16px;border-left:2px solid #8ea1e2}.quotes span{color:#aab3d4;font-size:clamp(10px,.88vw,15px)}.quotes b{font-size:clamp(13px,1.15vw,19px)}
    .prize{position:relative;display:flex;min-height:clamp(160px,19vw,320px);flex-direction:column;justify-content:center;padding:clamp(18px,2.4vw,38px);overflow:hidden;background:linear-gradient(145deg,rgba(238,239,255,.16),rgba(138,145,212,.08));border:1px solid rgba(230,232,255,.3);clip-path:polygon(5% 0,95% 0,100% 6%,100% 94%,95% 100%,5% 100%,0 94%,0 6%)}
    .prize:before{content:"P";position:absolute;right:13px;bottom:-32px;color:rgba(236,237,255,.07);font:clamp(112px,13vw,208px) Georgia,serif}.prize small{color:#9eabdb;font:clamp(8px,.65vw,11px) Georgia,serif;letter-spacing:.18em}.prize b{position:relative;margin:11px 0;font-size:clamp(18px,2.1vw,36px);line-height:1.25}.prize span{position:relative;color:var(--muted);font-size:clamp(9px,.77vw,13px)}
    .podium{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:clamp(11px,1.6vw,26px);margin-top:clamp(13px,1.8vw,27px)}
    .podium article{position:relative;min-height:clamp(130px,16vw,256px);display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,1.8vw,29px);overflow:hidden;border-top:1px solid rgba(225,228,255,.3);background:linear-gradient(145deg,rgba(102,120,189,.16),rgba(13,20,54,.16))}
    .podium article:first-child{background:linear-gradient(145deg,rgba(172,178,232,.24),rgba(35,43,88,.22));border-top-color:var(--gold)}.podium .num{position:absolute;right:12px;top:-8px;color:rgba(214,218,255,.08);font:clamp(72px,9vw,144px)/1 Georgia,serif}
    .podium p{position:relative;margin:0;font-size:clamp(14px,1.35vw,22px);font-weight:700}.podium strong{position:relative;margin:3px 0 9px;color:var(--lav);font:clamp(34px,4.6vw,77px)/1 Georgia,serif}.podium article:first-child strong{color:var(--gold)}.podium strong small{margin-left:3px;font:700 .28em sans-serif}.podium em{position:relative;min-height:2.4em;color:#9fa9cd;font-size:clamp(9px,.75vw,13px);font-style:normal;line-height:1.45}

    .highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,32px);margin-top:clamp(16px,2.2vw,35px)}
    .highlight{position:relative;min-height:clamp(208px,26vw,416px);display:grid;grid-template-columns:clamp(51px,6vw,96px) 1fr auto;align-items:center;gap:clamp(11px,1.4vw,22px);padding:clamp(16px,2.2vw,37px);overflow:hidden;color:inherit;text-decoration:none;border:1px solid rgba(226,229,255,.2);background:linear-gradient(145deg,rgba(102,121,197,.21),transparent 60%),rgba(13,20,55,.42);transition:.18s}.highlight:hover{transform:translateY(-5px);border-color:rgba(232,234,255,.56)}

    .whisper{position:absolute;left:clamp(26px,4.3vw,82px);bottom:41px;color:rgba(217,220,246,.55);font-size:clamp(8px,.7vw,12px)}
    .arts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,1.3vw,20px);margin-top:clamp(13px,1.6vw,24px)}

    .closing{display:grid;grid-template-columns:1fr minmax(192px,.42fr);align-items:center;gap:48px}.closing h2{margin:9px 0 0;font-size:clamp(45px,6.4vw,109px);letter-spacing:-.065em;line-height:1}.closing .copy>p:not(.serif){margin:clamp(13px,1.7vw,26px) 0 0;color:#bec5e4;font-size:clamp(14px,1.25vw,21px);line-height:1.6}
    .receipt{width:min(100%,624px);display:grid;gap:5px;margin-top:clamp(16px,2vw,32px);padding:clamp(13px,1.3vw,21px);border-left:3px solid var(--lav);background:linear-gradient(90deg,rgba(123,139,205,.18),transparent)}.receipt b{font-size:clamp(12px,1vw,17px)}.receipt span{color:var(--muted);font-size:clamp(9px,.78vw,13px)}
    .guide{margin-top:16px;font-size:clamp(10px,.8vw,14px)}.mono{position:relative;aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(223,226,255,.28);border-radius:50%;box-shadow:0 0 0 1rem rgba(171,176,232,.04),0 0 0 2rem rgba(171,176,232,.025),inset 0 0 3rem rgba(152,163,224,.12)}.mono:before,.mono:after{content:"";position:absolute;inset:13%;border:1px solid rgba(223,226,255,.15);transform:rotate(45deg)}.mono:after{inset:28%}.mono span{font:clamp(80px,12vw,192px)/1 Georgia,serif;text-shadow:0 0 2rem rgba(196,199,255,.35)}.mono small{position:absolute;bottom:13%;font:clamp(8px,.72vw,12px) Georgia,serif;letter-spacing:.22em}

      `<section class="slide">${title("POINT EXCHANGE · AUGUST","8월 포인트 교환 안내")}<div class="exchange"><div class="settlement"><article class="status"><small>09.02</small><strong>1차 정산 완료</strong><span>카페 활동인 팬아트, 팬영상 제작, 리캡을 제외한 활동 분</span></article><article class="status pending"><small>~ 09.06</small><strong>카페 활동 (팬아트/팬영상제작/리캡) 정산 예정</strong><span>이노리가 남겨드릴 카페 답글에 회신 주셔야 정산됩니다!</span></article></div><div class="schedule"><article class="date-card"><small>신청 기간</small><strong>09.03 — 09.15</strong></article><article class="date-card"><small>배송 기간</small><strong>09.15 — 09.30</strong></article><a class="form-btn" target="_blank" rel="noreferrer" href="https://forms.gle/BEXQu1djjSfr4xJr9"><span>포인트 교환 신청하기</span><b>↗</b></a></div></div><div class="exchange-note">신청한 포인트만큼 차감되며, 신청하지 않은 포인트는 다음 달로 이월됩니다.</div></section>`
    ];
    let index=0,touchX=null;
    const slide=document.getElementById("slide"),label=document.getElementById("label"),current=document.getElementById("current"),bar=document.getElementById("bar");
    document.getElementById("total").textContent=String(slides.length).padStart(2,"0");
    const render=()=>{slide.style.animation="none";void slide.offsetWidth;slide.style.animation="";slide.innerHTML=slides[index];label.textContent=labels[index];current.textContent=String(index+1).padStart(2,"0");bar.style.width=((index+1)/slides.length*100)+"%";document.getElementById("prev").disabled=index===0;document.getElementById("next").disabled=index===slides.length-1};
    const go=n=>{index=Math.max(0,Math.min(n,slides.length-1));render()},next=()=>go(index+1),prev=()=>go(index-1);
    document.getElementById("next").onclick=next;document.getElementById("prev").onclick=prev;
    document.getElementById("full").onclick=()=>document.documentElement.requestFullscreen?.();
    document.getElementById("app").addEventListener("click",e=>{if(e.target.closest("a,button"))return;e.clientX/window.innerWidth<.24?prev():next()});
    addEventListener("keydown",e=>{if(["ArrowRight"," ","Enter","PageDown"].includes(e.key)){e.preventDefault();next()}if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev()}if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);if(e.key.toLowerCase()==="f")document.documentElement.requestFullscreen?.()});
    addEventListener("touchstart",e=>touchX=e.touches[0]?.clientX,{passive:true});addEventListener("touchend",e=>{if(touchX===null)return;const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>50)d<0?next():prev();touchX=null},{passive:true});
    const sparkleLayer=document.getElementById("sparkles"),reduceMotion=matchMedia("(prefers-reduced-motion: reduce)"),liveSparkles=new Set(),sparkleColors=["#ffffff","#d8d6ff","#aebcf2","#fff5c8"];
    let lastSparkle=0;
    const sparkleAt=(x,y,count=1)=>{
      if(reduceMotion.matches)return;
      for(let i=0;i<count;i++){
        const star=document.createElement("i"),size=7+Math.random()*10;
        star.className="cursor-sparkle";star.textContent=Math.random()>.32?"✦":"✧";
        star.style.left=`${x+(Math.random()-.5)*14}px`;star.style.top=`${y+(Math.random()-.5)*10}px`;
        star.style.setProperty("--size",`${size}px`);star.style.setProperty("--dx",`${(Math.random()-.5)*54}px`);star.style.setProperty("--fall",`${42+Math.random()*72}px`);star.style.setProperty("--spin",`${120+Math.random()*300}deg`);star.style.setProperty("--life",`${720+Math.random()*520}ms`);star.style.setProperty("--spark",sparkleColors[Math.floor(Math.random()*sparkleColors.length)]);
        sparkleLayer.append(star);liveSparkles.add(star);
        star.addEventListener("animationend",()=>{liveSparkles.delete(star);star.remove()},{once:true});
        if(liveSparkles.size>80){const oldest=liveSparkles.values().next().value;liveSparkles.delete(oldest);oldest.remove()}
      }
    };
    addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const now=performance.now();if(now-lastSparkle<28)return;lastSparkle=now;sparkleAt(e.clientX,e.clientY,Math.random()>.76?2:1)},{passive:true});
    addEventListener("pointerdown",e=>sparkleAt(e.clientX,e.clientY,7),{passive:true});
    render();
  </script>
