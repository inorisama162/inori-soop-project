<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0f9">
  <title>이노리 신의상 공개 | 2026.09.03 17:00</title>
  <meta name="description" content="은박 속 세 개의 힌트를 찾아 이노리의 신의상을 미리 만나보세요.">
  <style>
    :root {
      --ink: #292331;
      --muted: #6e6678;
      --lavender: #b88ae7;
      --lavender-deep: #77509f;
      --pink: #f4a9ca;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(216,187,244,.42), transparent 30rem),
        radial-gradient(circle at 88% 92%, rgba(249,191,219,.34), transparent 28rem),
        #f3eef8;
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    button, img { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }

    .page-shell {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: clamp(8px, 2.8vw, 32px);
    }

    .notice-card {
      overflow: hidden;
      border: 1px solid rgba(94,70,120,.16);
      border-radius: clamp(18px, 3vw, 32px);
      background: rgba(252,250,255,.97);
      box-shadow: 0 24px 70px rgba(69,48,91,.17);
    }

    .notice-header {
      position: relative;
      overflow: hidden;
      padding: clamp(25px, 5vw, 52px) clamp(18px, 6vw, 64px) clamp(23px, 4vw, 42px);
      text-align: center;
      background: linear-gradient(135deg, rgba(255,255,255,.99), rgba(247,239,255,.96));
    }

    .notice-header::before,
    .notice-header::after {
      position: absolute;
      z-index: 0;
      border-radius: 999px;
      content: "";
      pointer-events: none;
    }

    .notice-header::before {
      width: 230px;
      height: 230px;
      left: -92px;
      top: -120px;
      background: rgba(205,162,241,.35);
    }

    .notice-header::after {
      width: 190px;
      height: 190px;
      right: -68px;
      bottom: -112px;
      background: rgba(248,172,209,.28);
    }

    .notice-header > * {
      position: relative;
      z-index: 1;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      margin: 0;
      padding: 6px 13px;
      border: 1px solid rgba(119,80,159,.24);
      border-radius: 999px;
      background: rgba(255,255,255,.74);
      color: var(--lavender-deep);
      font-size: clamp(.75rem, 1.8vw, .875rem);
      font-weight: 800;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0 7px;
      font-size: clamp(2rem, 6vw, 3.625rem);
      line-height: 1.08;
      letter-spacing: -.055em;
    }

    h1 span { color: var(--lavender-deep); }

    .program {
      margin: 0;
      color: #5f5769;
      font-size: clamp(1rem, 2.5vw, 1.3125rem);
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .quiz {
      display: inline-grid;
      gap: 3px;
      width: min(100%, 360px);
      margin-top: clamp(18px, 3.5vw, 28px);
      padding: 13px 20px 12px;
      border: 1px dashed rgba(108,74,142,.4);
      border-radius: 16px;
      background: rgba(255,255,255,.72);
    }

    .quiz small {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .quiz strong {
      padding-left: .24em;
      color: #352a40;
      font-size: clamp(1.625rem, 4vw, 2.1875rem);
      line-height: 1.2;
      letter-spacing: .24em;
    }

    .quiz em {
      color: #826f91;
      font-size: .75rem;
      font-style: normal;
      font-weight: 700;
    }

    .scratch-section {
      padding: clamp(17px, 4vw, 36px);
      border-top: 1px solid rgba(94,70,120,.14);
    }

    .guide-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 2px 13px;
    }

    .guide-row h2 {
      margin: 0;
      font-size: clamp(1.125rem, 3.2vw, 1.5625rem);
      letter-spacing: -.04em;
    }

    .guide-row p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(.75rem, 2vw, .875rem);
      word-break: keep-all;
    }

    .progress {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
    }

    .progress i {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(104,77,132,.25);
      border-radius: 50%;
      background: #e3dce8;
      box-shadow: inset 0 1px 2px rgba(72,50,92,.13);
      transition: 180ms ease;
    }

    .progress i.is-on {
      transform: scale(1.16);
      background: linear-gradient(135deg, var(--lavender), var(--pink));
      box-shadow: 0 0 0 3px rgba(184,138,231,.15);
    }

    .stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1536 / 811;
      border: 1px solid rgba(70,56,84,.2);
      border-radius: clamp(13px, 2.5vw, 24px);
      background: #b7afbd;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.42), 0 12px 30px rgba(61,46,77,.15);
      isolation: isolate;
    }

    .silver-cover {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .silver-cover {
      z-index: 2;
      pointer-events: none;
    }

    .hint-photo {
      position: absolute;
      z-index: 3;
      display: block;
      min-width: 42px;
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(.82);
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease, transform 420ms cubic-bezier(.2,.72,.25,1);
      user-select: none;
      -webkit-user-drag: none;
    }

    .hint-photo.is-visible {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .hint-eye {
      left: 56.97%;
      top: 22.19%;
      width: 11.07%;
    }

    .hint-knee {
      left: 34.83%;
      top: 57.46%;
      width: 7.82%;
    }

    .hint-bag {
      left: 47.79%;
      top: 67.82%;
      width: 9.25%;
    }

    /*
      세 개의 클릭 영역은 완전히 투명합니다.
      테두리·번호·그림자 없이 은박과 한 덩어리처럼 보입니다.
    */
    .hotspot {
      position: absolute;
      z-index: 4;
      display: block;
      min-width: 42px;
      aspect-ratio: 1;
      padding: 0;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 50%;
      outline: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .hotspot:focus-visible {
      outline: 2px solid rgba(104,66,138,.75);
      outline-offset: 3px;
    }

    .hotspot::before {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-linear-gradient(118deg, rgba(255,255,255,.18) 0 2px, transparent 2px 11px),
        radial-gradient(circle at 34% 26%, #e6e0e8 0, #b6aebb 58%, #958c9d 100%);
      box-shadow: 0 5px 12px rgba(31,23,39,.24);
      content: "";
      opacity: 0;
      pointer-events: none;
    }

    .hotspot.is-revealed {
      pointer-events: none;
    }

    .hotspot.is-revealed::before {
      opacity: 1;
      animation: foil-drop 700ms cubic-bezier(.2,.72,.25,1) forwards;
    }

    .hotspot-eye {
      left: 56.97%;
      top: 22.19%;
      width: 11.07%;
      --fall-x: 24px;
      --fall-r: 34deg;
    }

    .hotspot-knee {
      left: 34.83%;
      top: 57.46%;
      width: 7.82%;
      --fall-x: -26px;
      --fall-r: -28deg;
    }

    .hotspot-bag {
      left: 47.79%;
      top: 67.82%;
      width: 9.25%;
      --fall-x: 31px;
      --fall-r: 38deg;
    }

    @keyframes foil-drop {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0) scale(1);
      }
      24% {
        transform: translate(0, -8%) rotate(-6deg) scale(1.04);
      }
      100% {
        opacity: 0;
        transform: translate(var(--fall-x), 195%) rotate(var(--fall-r)) scale(.72);
      }
    }

    .complete-message {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 4.5%;
      max-width: calc(100% - 24px);
      padding: 9px 15px;
      transform: translate(-50%, 12px);
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 999px;
      background: rgba(43,34,51,.78);
      box-shadow: 0 8px 22px rgba(27,20,33,.24);
      color: #fff;
      font-size: clamp(.72rem, 1.7vw, .875rem);
      font-weight: 750;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: 280ms ease;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .complete-message.is-visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .schedule {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: clamp(20px, 3.5vw, 32px);
    }

    .schedule > div {
      min-width: 0;
      padding: 14px 9px;
      border: 1px solid rgba(94,70,120,.14);
      border-radius: 14px;
      background: #fff;
      text-align: center;
    }

    .schedule b,
    .schedule span { display: block; }

    .schedule b {
      margin-bottom: 3px;
      color: var(--lavender-deep);
      font-size: clamp(.72rem, 2vw, .875rem);
    }

    .schedule span {
      color: #4c4654;
      font-size: clamp(.72rem, 2vw, .875rem);
      font-weight: 700;
      word-break: keep-all;
    }

    .foot-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 27px;
      margin-top: 13px;
    }

    .foot-row p {
      margin: 0;
      color: #817989;
      font-size: .75rem;
      font-weight: 700;
      text-align: center;
    }

    .reset-button {
      display: none;
      flex: 0 0 auto;
      padding: 5px 9px;
      border: 1px solid rgba(107,78,136,.2);
      border-radius: 999px;
      background: #fff;
      color: #6f547f;
      font-size: .72rem;
      font-weight: 750;
      cursor: pointer;
    }

    .reset-button.is-visible { display: block; }
    .reset-button:hover { background: #f8f1fc; }

    @media (max-width: 560px) {
      .page-shell { padding: 6px; }
      .notice-card { border-radius: 18px; }
      .notice-header { padding-top: 23px; }
      .guide-row { align-items: center; }
      .guide-row p { max-width: 235px; }
      .stage { border-radius: 12px; }
      .complete-message { white-space: normal; }
      .schedule { gap: 6px; }
      .schedule > div {
        padding: 11px 4px;
        border-radius: 11px;
      }
      .foot-row {
        align-items: flex-start;
        gap: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

          <div><b>DATE</b><span>9월 3일 목요일</span></div>
          <div><b>TIME</b><span>오후 5시</span></div>
          <div><b>LIVE</b><span>신의상 첫 공개</span></div>
        </div>

        <div class="foot-row">
          <p>시청자 어워드 · 스코프데이 · 신의상 공개</p>
          <button class="reset-button" type="button">다시 가리기</button>

  </main>

  <script>
    (() => {
      const targets = {
        eye: { label: "오른쪽 눈 힌트" },
        knee: { label: "니삭스 무릎 힌트" },
        bag: { label: "곰돌이 가방 힌트" }
      };

      const revealed = new Set();
      const buttons = [...document.querySelectorAll(".hotspot")];
      const pips = [...document.querySelectorAll(".progress i")];
      const progress = document.querySelector(".progress");
      const completeMessage = document.querySelector(".complete-message");
      const resetButton = document.querySelector(".reset-button");

      function updateStatus() {
        const count = revealed.size;
        pips.forEach((pip, index) => pip.classList.toggle("is-on", index < count));
        progress.setAttribute("aria-label", count + "/3 발견");
        resetButton.classList.toggle("is-visible", count > 0);
        completeMessage.classList.toggle("is-visible", count === 3);
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.spot;
          if (!id || revealed.has(id)) return;

          revealed.add(id);
          button.classList.add("is-revealed");
          button.disabled = true;
          button.setAttribute("aria-label", targets[id].label + " 공개됨");
          document.querySelector("#hint-" + id).classList.add("is-visible");
          updateStatus();
        });
      });

      resetButton.addEventListener("click", () => {
        revealed.clear();
        buttons.forEach((button) => {
          button.classList.remove("is-revealed");
          button.disabled = false;
          const id = button.dataset.spot;
          button.setAttribute("aria-label", targets[id].label + " 찾기");
          document.querySelector("#hint-" + id).classList.remove("is-visible");
        });
        updateStatus();
      });
    })();
  </script>
